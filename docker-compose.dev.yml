# Запуск: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Или:    make dev
services:
  app:
    image: chords_app-dev
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - pw-cache:/root/.cache/ms-playwright   # persist browser binaries across container runs
    environment:
      NODE_ENV: development

volumes:
  pw-cache:
